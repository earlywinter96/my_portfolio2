<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27"/>
      <stop offset="100%" style="stop-color:#1a1e3f"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff9f"/>
      <stop offset="50%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <radialGradient id="radialGlow">
      <stop offset="0%" style="stop-color:#00ff9f;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#00ff9f;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="180" height="180" rx="40" fill="url(#bg2)"/>
  
  <!-- Radial glow behind text -->
  <circle cx="90" cy="90" r="70" fill="url(#radialGlow)"/>
  
  <!-- Grid background effect -->
  <g opacity="0.08">
    <line x1="0" y1="30" x2="180" y2="30" stroke="#00ff9f" stroke-width="2"/>
    <line x1="0" y1="60" x2="180" y2="60" stroke="#00ff9f" stroke-width="2"/>
    <line x1="0" y1="90" x2="180" y2="90" stroke="#00ff9f" stroke-width="2"/>
    <line x1="0" y1="120" x2="180" y2="120" stroke="#00ff9f" stroke-width="2"/>
    <line x1="0" y1="150" x2="180" y2="150" stroke="#00ff9f" stroke-width="2"/>
    <line x1="30" y1="0" x2="30" y2="180" stroke="#00ff9f" stroke-width="2"/>
    <line x1="60" y1="0" x2="60" y2="180" stroke="#00ff9f" stroke-width="2"/>
    <line x1="90" y1="0" x2="90" y2="180" stroke="#00ff9f" stroke-width="2"/>
    <line x1="120" y1="0" x2="120" y2="180" stroke="#00ff9f" stroke-width="2"/>
    <line x1="150" y1="0" x2="150" y2="180" stroke="#00ff9f" stroke-width="2"/>
  </g>
  
  <!-- Terminal window border -->
  <rect x="25" y="35" width="130" height="110" rx="8" fill="none" stroke="#00ff9f" stroke-width="2" opacity="0.4"/>
  
  <!-- Terminal prompt: $ -->
  <text x="40" y="80" font-family="monospace" font-size="40" font-weight="bold" fill="#00ff9f">
    $
    <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
  </text>
  
  <!-- whoami text with gradient -->
  <text x="40" y="120" font-family="monospace" font-size="28" font-weight="bold" fill="url(#glow2)">
    whoami
  </text>
  
  <!-- Blinking cursor -->
  <rect x="145" y="100" width="8" height="24" fill="#00ff9f">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Corner decorations (inspired by your whoami section) -->
  <path d="M 35 35 L 35 50 M 35 35 L 50 35" stroke="#00d4ff" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 145 145 L 145 130 M 145 145 L 130 145" stroke="#a855f7" stroke-width="2" fill="none" opacity="0.6"/>
  
  <!-- Outer glow border -->
  <rect width="180" height="180" rx="40" fill="none" stroke="url(#glow2)" stroke-width="2" opacity="0.3"/>
</svg>